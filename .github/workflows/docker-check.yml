name: Docker Compose Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-compose-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Check Docker Compose config
        run: docker compose config

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Show running containers
        run: docker ps

      - name: Detect Nginx port
        run: |
          PORT=$(docker compose port nginx 80 | sed 's/.*://')
          echo "NGINX_PORT=$PORT" >> $GITHUB_ENV
          echo "Detected port: $PORT"

      - name: Wait for app health check
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:$NGINX_PORT/health; then
              echo "App is ready"
              exit 0
            fi

            echo "Waiting for app..."
            sleep 2
          done

          echo "App did not start in time"
          docker compose logs
          exit 1

      - name: Test home page
        run: curl -f http://localhost:$NGINX_PORT/

      - name: Test API endpoint
        run: curl -f http://localhost:$NGINX_PORT/api

      - name: Test health endpoint
        run: curl -f http://localhost:$NGINX_PORT/health

      - name: Test stats endpoint
        run: curl -f http://localhost:$NGINX_PORT/stats

      - name: Show logs
        if: always()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down